<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Icono de ZeroStudy: Ø de hielo sobre placa negra con esquinas cortadas (familia ZERØ). -->
  <defs>
    <linearGradient id="placa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a26"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="hielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4ff"/>
      <stop offset="0.55" stop-color="#a8dcff"/>
      <stop offset="1" stop-color="#4da3ff"/>
    </linearGradient>
    <filter id="brillo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="rejilla" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4da3ff" stroke-opacity="0.09" stroke-width="2"/>
    </pattern>
  </defs>
  <path d="M24 24H420L488 92V488H92L24 420Z" fill="url(#placa)"/>
  <path d="M24 24H420L488 92V488H92L24 420Z" fill="url(#rejilla)"/>
  <path d="M24 24H420L488 92V488H92L24 420Z" fill="none" stroke="#26384d" stroke-width="6"/>
  <path d="M420 24L488 92" stroke="#4da3ff" stroke-width="8"/>
  <path d="M92 488L24 420" stroke="#4da3ff" stroke-width="8"/>
  <g filter="url(#brillo)" transform="skewX(-9) translate(40 0)">
    <ellipse cx="256" cy="262" rx="104" ry="138" fill="none" stroke="url(#hielo)" stroke-width="44"/>
    <path d="M150 420L362 104" stroke="url(#hielo)" stroke-width="34" stroke-linecap="square"/>
  </g>
</svg>
